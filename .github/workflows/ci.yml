name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- web (Next.js)
  web-lint:
    name: Web / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  web-typecheck:
    name: Web / Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  web-build:
    name: Web / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  web-api-types:
    name: Web / API types are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generate types from server/api/openapi.yaml
        run: npm run gen:api
      - name: Fail if the generated types are stale
        run: |
          if [ -n "$(git status --porcelain src/lib/api)" ]; then
            echo "::error::server/api/openapi.yaml과 web/src/lib/api/schema.d.ts가 맞지 않아요. 'make gen' 실행 후 커밋하세요."
            git diff --stat src/lib/api
            exit 1
          fi

  # ---------------------------------------------------------------- server (Go)
  server-lint:
    name: Server / Lint (architecture boundaries included)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
        working-directory: server
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: server

  server-test:
    name: Server / Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
        working-directory: server

  server-generated:
    name: Server / Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: Generate (OpenAPI, Service interfaces, mocks, sqlc)
        working-directory: server
        run: |
          go generate ./...
          sqlc generate
      - name: Fail if generated code is stale
        run: |
          if [ -n "$(git status --porcelain server)" ]; then
            echo "::error::생성 코드가 최신이 아니에요. 'make gen' 실행 후 커밋하세요."
            git status --porcelain server
            git diff --stat server
            exit 1
          fi

  # ---------------------------------------------------------------- labeling data (CSV)
  labeling-data:
    name: Labeling data / Schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/data/labeling.py

  # ---------------------------------------------------------------- ai-service (Python)
  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run pytest
        run: uv run pytest -q
