# ai-service: 계약서 분석(Python/FastAPI). 상태가 없어서 Deployment 로 둔다.
# 클러스터 안에서만 쓰이므로 Service 타입은 ClusterIP(기본값)이고 밖으로 노출하지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: cleansign/ai-service # 태그는 overlay 의 images: 에서 정한다
          ports:
            - name: http
              containerPort: 8000
          env:
            # 이 환경에는 Ollama 가 없으므로 키워드 분류기(mock)를 쓴다.
            - name: LLM_PROVIDER
              value: mock
            # server -> ai-service 호출을 인증하는 공유 토큰. server 의 AI_SERVICE_TOKEN 과 같은 값이어야 한다.
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cleansign-secrets
                  key: INTERNAL_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          # mock 이어도 스캔 PDF 를 OCR 로 읽을 때 메모리를 많이 쓴다. 768Mi 한도에서 OOMKilled(exit 137)가 났다.
          # 한도를 넘으면 컨테이너가 강제 종료되고 진행 중이던 분석은 실패한다. 실측 후 다시 조정할 것.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
