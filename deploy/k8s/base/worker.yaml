# worker: 분석 작업을 실제로 돌리는 프로세스. server 와 같은 이미지에서 `server worker` 로 실행한다.
#
# server 는 업로드를 받아 DB 의 큐(contract 테이블)에 넣기만 하고, worker 가 그 큐에서 작업을 가져가
# ai-service 를 호출한다. worker 는 HTTP API 가 없으므로 Service 도 없다(헬스 체크 포트만 있다).
#
# 작업은 "lease"(기한이 있는 소유권)로 잡는다. worker 가 도중에 죽어도 lease 가 만료되면
# 다른 worker 가 이어받는다(최대 3회, 30초 후와 2분 후에 재시도).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  # 동시에 몇 개를 띄워도 된다(SKIP LOCKED 로 서로 다른 작업을 가져간다).
  # 다만 ai-service 가 OCR 에서 메모리를 많이 쓰고 한 번에 하나만 처리하므로 처리량은 ai-service 쪽이 한계다.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # SIGTERM 을 받으면 새 작업을 더 안 가져가고, 진행 중인 분석을 최대 30초 기다린다.
      # 그래도 안 끝나면 작업을 큐에 되돌리고(시도 횟수는 세지 않는다) 종료한다. 그 시간보다 길게 잡는다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: cleansign/server # server 와 같은 이미지. 태그는 overlay 의 images: 에서 정한다
          args: ["worker"]
          ports:
            - name: health
              containerPort: 4001
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cleansign-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/cleansign?sslmode=disable
            - name: AI_SERVICE_URL
              value: http://ai-service:8000
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cleansign-secrets
                  key: INTERNAL_TOKEN
            # worker 하나가 동시에 돌리는 분석 수. OCR 이 메모리를 많이 써서 1 로 둔다.
            - name: WORKER_CONCURRENCY
              value: "1"
            - name: WORKER_HEALTH_PORT
              value: "4001"
          # DB 에 연결되면 200. worker 는 마이그레이션을 하지 않으므로(server 가 한다) 스키마가 없으면 큐 조회가 오류를
          # 로그에 남기며 재시도하지만, 프로세스는 살아 있다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
